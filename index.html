<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login_page</title>
</head>
<style>
    * {
      margin: 0;
      padding: 0;
      font-family: 'Times New Roman';
    }
  .container {
    position: relative;
  }
   
  .card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translateX(-50%)translateY(-50%);
    width:auto;
    height: 350px;
    background-color: rgb(187, 161, 161);
    border-radius: 10px;
    text-align: center; 
    align-content: center;
    box-shadow:5px 5px 20px 2px rgb(127, 106, 106) ;
    padding:10px;
  }
  .Name{
    margin:10px;
  }
  .email {
   
    margin: 10px;
  }
  .password {
    margin: 10px;
  }
  .submit {
    padding: 10px 12px;
    margin-top:25px;
    text-align:center;
    cursor: pointer;
    text-decoration: none;
    border: none;
    border-radius: 10px;
    background-color: rgb(65, 6, 12);
    color:whitesmoke;
    font-size: 15px;
  }
  p{
    font-size:25px;
    color:rgb(0, 0, 0);
    padding-bottom:15px;
    padding-top: 15px;
  } 
  input{
    border:2px solid rgb(134, 86, 86);
    border-radius:10px; 
    padding:10px 30px;
    background-color: rgb(212, 212, 212);
  }
  input:focus{
    box-shadow: 6px 6px 10px rgb(0,0 0,1),
    1px 1px 10px rgb(255,255,255,0.6);
    transform: scale(1.1);
  }
  </style>
<body>
    <div class="contaier">
        <div class="card">
          <p>Login Page</p>
          <form action="Home_page.html" >
            <div >
               <input type="text" placeholder="User Name"class="Name" id="Name" required />
            </div>
            <div>
              <input class="email" type="Email" placeholder="Email" name="Email" required />
            </div>
            <div>
              <input class="password"
                type="Password"
                placeholder="Password"
                minlength="6"
                required />
            </div>
            <div>
              <button class="submit" type="submit">Login</button>
            </div>
          </form>
        </div>
      </div>

</body>
</html>
